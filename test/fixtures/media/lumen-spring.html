<!-- The demo ad that test/fixtures/media/lumen-spring.mp4 was rendered from: each frame captured with Playwright (animations paused and stepped from 0.9s, 30 fps, 5.5 s), then ffmpeg to H.264 with a soft sine-chord music bed. -->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:local("Inter Variable"),local("Inter");font-weight:100 900}
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:720px;overflow:hidden;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
.stage{position:absolute;inset:0;background:radial-gradient(120% 90% at 20% 10%,#ffd9c2 0%,#ff9fb4 45%,#b48cff 100%);animation:bg 6s linear forwards}
@keyframes bg{to{filter:hue-rotate(-18deg) saturate(1.1)}}
.sun{position:absolute;width:520px;height:520px;border-radius:50%;right:-120px;top:-160px;background:radial-gradient(circle,#fff6d8 0%,#ffe08a 40%,rgba(255,224,138,0) 70%);animation:sun 6s ease-in-out forwards;opacity:.9}
@keyframes sun{from{transform:translate(60px,60px) scale(.8)}to{transform:translate(-40px,20px) scale(1.05)}}
.s{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1d1230;opacity:0}
.s1{animation:show 2.1s 0s both}
.s2{animation:show 2.1s 1.95s both}
.s3{animation:last 2.2s 3.8s both}
@keyframes show{0%{opacity:0}8%{opacity:1}88%{opacity:1}100%{opacity:0}}
@keyframes last{0%{opacity:0}10%{opacity:1}100%{opacity:1}}
.kicker{font-size:22px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;opacity:.7}
.t1{font-size:120px;font-weight:800;letter-spacing:-.045em;line-height:1;margin-top:14px;display:flex;gap:26px}
.t1 span{display:inline-block;animation:up .7s cubic-bezier(.2,.9,.2,1) both}
.t1 span:nth-child(2){animation-delay:.12s}.t1 span:nth-child(3){animation-delay:.24s}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.cards{display:flex;gap:26px}
.card{width:300px;height:250px;border-radius:28px;background:rgba(255,255,255,.62);backdrop-filter:blur(8px);box-shadow:0 30px 60px -20px rgba(60,20,90,.35);padding:34px;display:flex;flex-direction:column;justify-content:space-between;animation:pop .6s cubic-bezier(.2,1.2,.3,1) both}
.card:nth-child(1){animation-delay:2.05s}.card:nth-child(2){animation-delay:2.25s}.card:nth-child(3){animation-delay:2.45s}
@keyframes pop{from{transform:translateY(40px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.ic{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:30px;font-weight:800;color:#fff}
.card h3{font-size:40px;font-weight:750;letter-spacing:-.03em}
.card p{font-size:20px;opacity:.7;margin-top:6px;font-weight:500}
.brand{font-size:150px;font-weight:850;letter-spacing:-.06em;line-height:1;animation:zoom 2.2s cubic-bezier(.2,.9,.2,1) 3.8s both}
@keyframes zoom{from{transform:scale(.85);opacity:0}30%{opacity:1}to{transform:scale(1)}}
.tag{font-size:30px;font-weight:550;margin-top:14px;opacity:.75}
.cta{margin-top:40px;background:#1d1230;color:#fff;font-size:30px;font-weight:700;padding:22px 48px;border-radius:999px;animation:pulse 1.2s ease-in-out 4.6s infinite both;box-shadow:0 20px 40px -12px rgba(29,18,48,.5)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
</style></head><body><div class="stage"></div><div class="sun"></div>
<div class="s s1"><div class="kicker">New this spring</div><div class="t1"><span>Light</span><span>that</span><span>follows.</span></div></div>
<div class="s s2"><div class="cards">
<div class="card"><div class="ic" style="background:#ff8a65">☀</div><div><h3>Brighter</h3><p>Twice the light</p></div></div>
<div class="card"><div class="ic" style="background:#ec6aa0">♪</div><div><h3>Silent</h3><p>No hum, ever</p></div></div>
<div class="card"><div class="ic" style="background:#8f6cf0">∞</div><div><h3>All day</h3><p>18 hour battery</p></div></div>
</div></div>
<div class="s s3"><div class="brand">Lumen 2</div><div class="tag">The desk lamp that follows the sun.</div><div class="cta">Try it free</div></div>
</body></html>
